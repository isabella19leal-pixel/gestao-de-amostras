<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestão de Amostras Sond — Cadastros</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --ink:        #17191B;
    --panel:      #1F2226;
    --panel-2:    #24282D;
    --line:       #33383D;
    --stone:      #C9C2B4;
    --stone-dim:  #8B8A82;
    --clay:       #B5652D;
    --clay-dim:   #8C4F24;
    --core-green: #5C7A5E;
    --warn-amber: #C9A227;
    --alert-brick:#A6453B;
    --radius: 3px;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background: var(--ink); color: var(--stone); font-family:'Space Grotesk', sans-serif; font-size:15px; line-height:1.5; }
  .mono { font-family:'IBM Plex Mono', monospace; }
  a { color: var(--clay); }
  ::selection { background: var(--clay-dim); color: var(--stone); }
  :focus-visible { outline: 2px solid var(--clay); outline-offset: 2px; }
  .wrap { max-width: 880px; margin:0 auto; padding: 40px 24px 96px; }

  header.masthead { border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:28px; display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .masthead .eyebrow { font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.04em; color:var(--stone-dim); margin:0 0 6px; }
  .masthead h1 { font-size:22px; font-weight:600; margin:0; letter-spacing:-.01em; }
  .session-box { text-align:right; font-size:13px; color:var(--stone-dim); }
  .session-box .who { color:var(--stone); font-family:'IBM Plex Mono', monospace; font-size:13px; }
  .session-box .perfil-tag { display:inline-block; margin-left:8px; padding:1px 6px; border:1px solid var(--line); border-left:3px solid var(--clay); font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.03em; }
  .link-btn { background:none; border:none; color:var(--stone-dim); text-decoration:underline; cursor:pointer; font-family:'Space Grotesk', sans-serif; font-size:13px; padding:0; margin-top:4px; margin-right:14px; }
  .link-btn:hover { color: var(--stone); }

  section.block { border-top:1px solid var(--line); padding-top:20px; margin-top:28px; }
  section.block .block-label { font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:.06em; color:var(--stone-dim); margin:0 0 14px; }

  .form-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:12px; }
  .form-grid.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
  .form-grid label { display:block; font-size:11px; color:var(--stone-dim); margin-bottom:4px; }
  .form-grid input, .form-grid select {
    width:100%; background: var(--panel); border:1px solid var(--line); color: var(--stone);
    padding:8px 10px; font-family:'Space Grotesk', sans-serif; font-size:13px; border-radius: var(--radius);
  }
  .form-grid input:focus, .form-grid select:focus { border-color: var(--clay); }
  .checkbox-row { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--stone-dim); }

  button.primary {
    background: var(--clay); color:#17191B; border:none; font-family:'Space Grotesk', sans-serif;
    font-weight:600; font-size:13px; padding:9px 16px; border-radius: var(--radius); cursor:pointer;
  }
  button.primary:hover { background:#C77339; }
  button.primary:disabled { background: var(--panel-2); color: var(--stone-dim); cursor:not-allowed; }
  button.small {
    background:none; border:1px solid var(--line); color:var(--stone); font-family:'Space Grotesk', sans-serif;
    font-size:12px; padding:5px 10px; border-radius: var(--radius); cursor:pointer;
  }
  button.small:hover { border-color: var(--stone-dim); }

  .card-list { display:flex; flex-direction:column; gap:1px; background: var(--line); border:1px solid var(--line); margin-top:14px; }
  .card-row { background: var(--panel); padding:10px 14px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .card-row .name { font-size:13px; }
  .card-row .meta { font-size:12px; color: var(--stone-dim); }
  .card-row .actions { display:flex; gap:8px; align-items:center; }
  .empty-note { color: var(--stone-dim); font-size:13px; padding:14px; background: var(--panel); border:1px solid var(--line); margin-top:14px; }

  .tag { display:inline-block; padding:2px 7px; border-left:3px solid var(--stone-dim); font-family:'IBM Plex Mono', monospace; font-size:11px; background: var(--panel-2); }
  .tag.ativa { border-left-color: var(--core-green); }
  .tag.inativa { border-left-color: var(--alert-brick); }

  .banner { padding:10px 14px; border:1px solid var(--line); border-left:3px solid var(--stone-dim); font-size:13px; margin-bottom:14px; }
  .banner.error { border-left-color: var(--alert-brick); color: var(--alert-brick); }
  .banner.success { border-left-color: var(--core-green); color: var(--core-green); }

  select.status-select {
    background: var(--panel); border:1px solid var(--line); color: var(--stone);
    padding:5px 8px; font-family:'IBM Plex Mono', monospace; font-size:12px; border-radius: var(--radius);
  }

  [hidden] { display:none !important; }
  @media (max-width:560px) { .form-grid, .form-grid.cols-3 { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div id="loginView">
  <div class="wrap">
    <header class="masthead">
      <div><p class="eyebrow">GESTÃO DE AMOSTRAS · SOND</p><h1>Cadastros</h1></div>
    </header>
    <div style="max-width:360px;margin:64px auto;padding:28px;background:var(--panel);border:1px solid var(--line);">
      <h2 style="font-size:17px;margin:0 0 4px;">Entrar</h2>
      <p style="color:var(--stone-dim);font-size:13px;margin:0 0 20px;">Use seu e-mail e senha cadastrados no Supabase.</p>
      <form id="loginForm">
        <label style="display:block;font-size:12px;color:var(--stone-dim);margin-bottom:4px;">E-mail</label>
        <input type="email" id="loginEmail" required autocomplete="username" style="width:100%;background:var(--ink);border:1px solid var(--line);color:var(--stone);padding:9px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;border-radius:3px;margin-bottom:14px;">
        <label style="display:block;font-size:12px;color:var(--stone-dim);margin-bottom:4px;">Senha</label>
        <input type="password" id="loginPassword" required autocomplete="current-password" style="width:100%;background:var(--ink);border:1px solid var(--line);color:var(--stone);padding:9px 10px;font-family:'IBM Plex Mono',monospace;font-size:13px;border-radius:3px;margin-bottom:14px;">
        <p class="banner error" id="loginError" hidden></p>
        <button type="submit" id="loginBtn" class="primary" style="width:100%;">Entrar</button>
      </form>
    </div>
  </div>
</div>

<div id="appView" hidden>
  <div class="wrap">

    <header class="masthead">
      <div><p class="eyebrow">GESTÃO DE AMOSTRAS · SOND</p><h1>Cadastros</h1></div>
      <div class="session-box">
        <div><span class="who" id="sessionEmail"></span><span class="perfil-tag" id="sessionPerfil"></span></div>
        <button class="link-btn" onclick="location.href='dashboard.html'">Dashboard</button>
        <button class="link-btn" onclick="location.href='importador.html'">Importador</button>
        <button class="link-btn" id="logoutBtn">Sair</button>
      </div>
    </header>

    <div id="semPermissaoBanner" class="banner error" hidden>
      Cadastros são exclusivos do perfil ADMIN. Seu perfil atual só tem acesso de consulta.
    </div>

    <div id="mainContent">

      <!-- ===================== BASES ===================== -->
      <section class="block">
        <p class="block-label">BASES</p>
        <form id="formBase">
          <div class="form-grid cols-3">
            <div><label>Nome *</label><input type="text" id="baseNome" required placeholder="Base Sorocaba"></div>
            <div><label>Cidade</label><input type="text" id="baseCidade"></div>
            <div><label>Estado</label><input type="text" id="baseEstado" maxlength="2" placeholder="SP"></div>
          </div>
          <button type="submit" class="primary">Cadastrar base</button>
        </form>
        <p class="banner error" id="baseError" hidden></p>
        <div class="card-list" id="basesList"></div>
      </section>

      <!-- ===================== OS -> CONTRATO ===================== -->
      <section class="block">
        <p class="block-label">ORDEM DE SERVIÇO → SUP/CONTRATO</p>
        <form id="formOsContrato">
          <div class="form-grid">
            <div><label>Ordem de Serviço *</label><input type="text" id="osOrdemServico" required placeholder="17902-26"></div>
            <div><label>SUP/Contrato *</label><input type="text" id="osSupContrato" required placeholder="SUP-8370-25"></div>
          </div>
          <button type="submit" class="primary">Vincular</button>
        </form>
        <p class="banner error" id="osContratoError" hidden></p>
        <p class="banner success" id="osContratoSuccess" hidden></p>
        <div class="card-list" id="osContratoList"></div>
      </section>

      <!-- ===================== CONTRATO -> BASE ===================== -->
      <section class="block">
        <p class="block-label">SUP/CONTRATO → BASE</p>
        <form id="formContratoBase">
          <div class="form-grid">
            <div><label>SUP/Contrato *</label><input type="text" id="cbSupContrato" required placeholder="SUP-8370-25"></div>
            <div><label>Base *</label><select id="cbBaseId" required><option value="">Selecione…</option></select></div>
          </div>
          <button type="submit" class="primary">Vincular</button>
        </form>
        <p class="banner error" id="contratoBaseError" hidden></p>
        <p class="banner success" id="contratoBaseSuccess" hidden></p>
        <div class="card-list" id="contratoBaseList"></div>
      </section>

      <!-- ===================== FRETES ===================== -->
      <section class="block">
        <p class="block-label">FRETES</p>
        <form id="formFrete">
          <div class="form-grid cols-3">
            <div><label>Código do frete *</label><input type="text" id="freteCodigo" required placeholder="FRETE-001"></div>
            <div><label>Base de origem</label><select id="freteBaseOrigem"><option value="">—</option></select></div>
            <div><label>Transportadora</label><input type="text" id="freteTransportadora"></div>
            <div><label>Motorista</label><input type="text" id="freteMotorista"></div>
            <div><label>Placa</label><input type="text" id="fretePlaca"></div>
            <div><label>Data prevista de chegada</label><input type="date" id="fretePrevisaoChegada"></div>
          </div>
          <button type="submit" class="primary">Cadastrar frete</button>
        </form>
        <p class="banner error" id="freteError" hidden></p>
        <div class="card-list" id="fretesList"></div>
      </section>

    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="cadastros.js"></script>
</body>
</html>
